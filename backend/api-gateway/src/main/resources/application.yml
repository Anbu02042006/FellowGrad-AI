server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: conversation-service
          uri: lb://conversation-service
          predicates:
            - Path=/api/conversations/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
        - id: voice-service
          uri: lb://voice-service
          predicates:
            - Path=/api/voice/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
